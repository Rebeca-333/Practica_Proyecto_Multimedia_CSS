<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Iniciar sesión / Registrarse</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="./css/estilo.css" title="Estilo Principal">
   <link rel="alternate stylesheet" href="./css/alto-contraste.css" title="Alto Contraste" id="link-contraste"> 
</head>
<body>
    
    <header>
        <div id="menuPrincipal">
            <a href="./index.html"><img src="./img/Logo.png" alt="logo" class="logo"></a>
            <div id="buscador">
                <form action="#" method="get">
                    <input type="text" name="buscador" id="busca">
                    <button type="button" class="boton_buscar"><img src="./img/search.svg" alt="buscar" class="imagen_buscar"></button>
                </form>
            </div>
            <div id="usuario">
                <a href="./sesion.html" class="inicio_sesion">
                    <img src="./img/person.svg" alt="" class="imagen_usuario">
                    Inicio<br>Sesion
                </a>
            </div>
            <div id="compra">
                <a href="./comprar.html" class="carrito"><img src="./img/shopping_cart.svg" alt="carrito" class="imagen_carrito"></a>
            </div>
            <div id="boton_contraste">
                <button type="button" class="boton_altoContraste">Alto Contraste</button>
            </div>
        </div>
        <div class="enlaces">
            <nav>
                <a href="./lista-productos.html" class="a_enlaces">Mujer</a>
                <a href="./lista-productos.html" class="a_enlaces">Hombre</a>
                <a href="./lista-productos.html" class="a_enlaces">Niño/a</a>
                <a href="./lista-productos.html" class="a_enlaces">Accesorios</a>
                <a href="./lista-productos.html" class="a_enlaces">Otros</a>
            </nav>
        </div>
    </header>
   
   
   <main>
        <section class="contenedor">
            <div class="columna">
                <form action="#" method="POST">
                    <h2>Registrarse</h2>
                    <label>Nombre completo <br>
                        <input type="text" name="nombre_completo" >
                    </label> <br> <br>
                    <label>Fecha de nacimiento<br>
                        <input type="date" name="fecha_nacimiento" >
                    </label> <br> <br>
                    <label>Correo electrónico<br>
                        <input type="email" name="correo" >
                    </label> <br> <br>
                    <label>Nombre usuario<br>
                        <input type="text" name="usuario" >
                    </label> <br> <br>
                    <label>Contraseña <br>
                        <input type="password" name="contrasena" >
                    </label> <br> <br>
                    <label>Confirmar contraseña<br>
                        <input type="password" name="confirmar_contrasena" >
                    </label> <br> <br>                         
                    <input type="button" value="Crear" class="boton">
                </form>
            </div>     
            <div class="columna">
                <form action="#" method="POST">
                    <h2>Iniciar sesión</h2>
                    <label>Nombre usuario<br>
                        <input type="text" name="usuario" >
                    </label> <br> <br>
                    <label>Contraseña <br>
                        <input type="password" name="contrasena" >
                    </label> <br> <br>
                    <input type="button" value="Entrar" class="boton">
                </form>
            </div>
        </section>
   </main>

    <footer>
        <div id="redes">
            <a href="#"><img src="./img/Facebook.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/Instagram.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/TikTok.png" alt="" class="imagenes_redes"></a>
        </div>
        <div id="masEnlaces">
            <div class="enlaces_footer">
                <a href="./sobreNosotros.html" >Sobre Nosotros</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Terminos y Condiciones</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Ayuda</a>
            </div>
        </div>
    </footer>

    <!--Codigo para el boton de alto contraste-->
    <script>
        onload=()=>{
            document.getElementsByClassName("boton_altoContraste")[0].addEventListener("click",CambiarAltoContraste)
        }

        const stylesheetAlterno = document.getElementById('link-contraste');

        function CambiarAltoContraste(){
            if (stylesheetAlterno.disabled) {
                stylesheetAlterno.disabled = false; // ACTIVAR el archivo alternativo
            } else {
                stylesheetAlterno.disabled = true;  // DESACTIVAR el archivo alternativo
            }
        }

    </script>

</body>
</html>
